<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>✏️ Editar Despachos (Sheets)</title>
  <style>
    :root{--bg:#0b1220;--card:#101a33;--text:#e9eefc;--muted:#a7b2d6;--line:#22305a;--ok:#2ecc71;--warn:#f7b500;--work:#2d7dff;--bad:#e74c3c;}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#070b14,var(--bg));color:var(--text);}
    header{padding:16px 18px;position:sticky;top:0;background:rgba(11,18,32,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:10}
    header h1{margin:0;font-size:18px}
    header p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .wrap{max-width:1200px;margin:0 auto;padding:16px}
    .grid{display:grid;gap:12px;min-height:70vh;}
    @media(min-width:980px){.grid{grid-template-columns:1.2fr .8fr}}
    .card{background:rgba(16,26,51,.92);border:1px solid var(--line);border-radius:14px;padding:14px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
    .filters{display:flex;gap:6px;flex-wrap:wrap}
    input,textarea{width:100%;box-sizing:border-box;padding:10px;background:#0b1430;color:var(--text);border:1px solid var(--line);border-radius:10px;outline:none}
    textarea{min-height:90px;resize:vertical}
    button,a.btn{border:1px solid var(--line);background:#0b1430;color:var(--text);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:900}
    button.active{background:#2d7dff;border-color:#2d7dff}
    button.good{background:linear-gradient(180deg,#3be28a,#2ecc71);border-color:#2ecc71}
    button.primary{background:linear-gradient(180deg,#2d7dff,#1f5ed4);border-color:#1f5ed4}
    button.danger{background:linear-gradient(180deg,#ff6b6b,#e74c3c);border-color:#e74c3c}
    table{width:100%;border-collapse:collapse}
    #tabla thead th{position:sticky;top:0;z-index:5;background:#101a33;color:var(--muted);border-bottom:2px solid var(--line)}
    th,td{border-bottom:1px solid var(--line);padding:10px 8px;font-size:13px}
    .badge{padding:6px 10px;border-radius:999px;color:#fff;font-weight:900;font-size:12px}
    .small{font-size:12px;color:var(--muted)}
    .tools{display:flex;gap:6px;flex-wrap:wrap}
    .toast{display:none;position:fixed;right:16px;bottom:16px;background:#0b1430;border:1px solid var(--line);padding:12px 14px;border-radius:14px}
  </style>
</head>

<body>
<header>
  <h1>✏️ Edición (Google Sheets)</h1>
  <p>Multiusuario: todos ven lo mismo. Guarda por etapas.</p>
</header>

<div class="wrap grid">
  <section class="card">
    <div class="topbar">
      <input id="filtro" placeholder="Buscar texto…" />

      <!-- ✅ FILTROS RÁPIDOS -->
      <div class="filters">
        <button id="fHoy">Hoy</button>
        <button id="fManana">Mañana</button>
        <button id="fTodos" class="active">Todos</button>
      </div>
    </div>

    <div style="overflow:auto;max-height:70vh">
      <table id="tabla">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Despacho</th>
            <th>Exportadora</th>
            <th>Transporte</th>
            <th>Estado</th>
            <th>⏱</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <form id="form">
      <label>Fecha de programación</label>
      <input id="fechaProgramacion" type="date">

      <label>N° Despacho</label><input id="numeroDespacho">
      <label>Exportadora</label><input id="exportadora">
      <label>Hora citación</label><input id="horaCitacion" type="time">
      <label>Cantidad pallets</label><input id="cantidadPallets" type="number">
      <label>Transporte</label><input id="transporte">

      <div class="tools" style="margin-top:10px">
        <button class="primary">Guardar</button>
      </div>
    </form>
  </section>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwj5pxE2ui8O9GEseGX74aktU2EiwDRYxXQbrCTo5uTn8wXbc55p4J5-p0-cJPqarWAJw/exec";
const SECRET="FP2026DESPACHOS";
const $=id=>document.getElementById(id);
let rows=[], filtroFecha="all";

function hoyISO(d=0){
  const x=new Date(); x.setDate(x.getDate()+d);
  return x.toISOString().slice(0,10);
}

function estado(r){
  if(!r.horaLlegada) return {t:"En espera",c:"#f7b500"};
  if(!r.horaTermino) return {t:"Cargando",c:"#2d7dff"};
  return {t:"Despachado",c:"#2ecc71"};
}

function fmtFecha(v){
  if(!v) return "—";
  return typeof v==="string"?v.slice(0,10):new Date(v).toLocaleDateString("es-CL");
}

async function loadRows(){
  const r=await fetch(API_URL); return await r.json();
}

function aplicarFiltroFecha(r){
  if(filtroFecha==="today") return r.fechaProgramacion===hoyISO(0);
  if(filtroFecha==="tomorrow") return r.fechaProgramacion===hoyISO(1);
  return true;
}

function render(){
  const q=($("filtro").value||"").toLowerCase();
  const tbody=document.querySelector("#tabla tbody");
  tbody.innerHTML="";
  rows
    .filter(aplicarFiltroFecha)
    .filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q))
    .forEach(r=>{
      const e=estado(r);
      const tr=document.createElement("tr");
      tr.innerHTML=`
        <td>${fmtFecha(r.fechaProgramacion)}</td>
        <td>${r.numeroDespacho||""}</td>
        <td>${r.exportadora||""}</td>
        <td>${r.transporte||""}</td>
        <td><span class="badge" style="background:${e.c}">${e.t}</span></td>
        <td>—</td>
        <td><button>Editar</button></td>`;
      tbody.appendChild(tr);
    });
}

async function refresh(){ rows=await loadRows(); render(); }

$("fHoy").onclick=()=>{filtroFecha="today";activar("fHoy")};
$("fManana").onclick=()=>{filtroFecha="tomorrow";activar("fManana")};
$("fTodos").onclick=()=>{filtroFecha="all";activar("fTodos")};

function activar(id){
  ["fHoy","fManana","fTodos"].forEach(x=>$(x).classList.remove("active"));
  $(id).classList.add("active");
  render();
}

$("filtro").oninput=render;
refresh();
</script>
</body>
</html>
