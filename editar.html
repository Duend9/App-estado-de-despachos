<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✏️ Editar Despachos (Sheets)</title>

<style>
:root{--bg:#0b1220;--card:#101a33;--text:#e9eefc;--muted:#a7b2d6;--line:#22305a;--ok:#2ecc71;--warn:#f7b500;--work:#2d7dff;--bad:#e74c3c;}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#070b14,var(--bg));color:var(--text);}
header{padding:16px 18px;position:sticky;top:0;background:rgba(11,18,32,.92);border-bottom:1px solid var(--line);z-index:10}
header h1{margin:0;font-size:18px}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
@media(min-width:980px){.grid{grid-template-columns:1.2fr .8fr}}
.card{background:#101a33;border:1px solid var(--line);border-radius:14px;padding:14px}
input,textarea{width:100%;padding:10px;background:#0b1430;color:var(--text);border:1px solid var(--line);border-radius:10px}
textarea{min-height:90px}
button{border:1px solid var(--line);background:#0b1430;color:#fff;padding:8px 12px;border-radius:10px;font-weight:900}
button.good{background:#2ecc71}
button.primary{background:#2d7dff}
button.danger{background:#e74c3c}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:8px}
.badge{padding:6px 10px;border-radius:999px;color:#fff;font-weight:900;font-size:12px}
.small{font-size:12px;color:#a7b2d6}
.tools{display:flex;gap:6px}
</style>
</head>

<body>

<header>
  <h1>✏️ Edición (Google Sheets)</h1>
</header>

<div class="wrap grid">

<section class="card">
  <table id="tabla">
    <thead>
      <tr>
        <th>Fecha</th>
        <th>Despacho</th>
        <th>Exportadora / Mercado</th>
        <th>Transporte</th>
        <th>Estado</th>
        <th>⏱</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>

<section class="card">
<form id="form">
  <label>Fecha de programación</label>
  <input id="fechaProgramacion" type="date">

  <label>N° Despacho</label><input id="numeroDespacho">
  <label>Exportadora</label><input id="exportadora">
  <label>Tipo movimiento</label><input id="tipoMovimiento">
  <label>Variedad</label><input id="variedad">
  <label>Mercado</label><input id="mercado">
  <label>Hora citación</label><input id="horaCitacion" type="time">
  <label>Cantidad pallets</label><input id="cantidadPallets" type="number">
  <label>Transporte</label><input id="transporte">
  <label>Hora llegada</label><input id="horaLlegada" type="time">
  <label>Hora inicio carga</label><input id="horaInicioCarga" type="time">
  <label>Hora término carga</label><input id="horaTermino" type="time">
  <label>Observaciones</label><textarea id="observaciones"></textarea>

  <div class="tools">
    <button class="primary">Guardar</button>
    <button type="button" id="btnNuevo">Nuevo</button>
    <button type="button" id="btnEliminar" class="danger">Eliminar</button>
  </div>
</form>
</section>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwj5pxE2ui8O9GEseGX74aktU2EiwDRYxXQbrCTo5uTn8wXbc55p4J5-p0-cJPqarWAJw/exec";
const SECRET="FP2026DESPACHOS";
const $=id=>document.getElementById(id);
let rows=[], editId=null;

function fechaISO(v){
  if(!v) return "";
  if(typeof v==="string" && v.includes("-")) return v.slice(0,10);
  const d=new Date(v);
  return !isNaN(d)?d.toISOString().slice(0,10):"";
}
function hh(v){
  if(!v) return "";
  if(typeof v==="string") return v.slice(0,5);
  return new Date(v).toTimeString().slice(0,5);
}

async function loadRows(){
  const r=await fetch(API_URL);
  rows=await r.json();
  render();
}

function render(){
  const tb=document.querySelector("#tabla tbody");
  tb.innerHTML="";
  rows.forEach(r=>{
    tb.innerHTML+=`
    <tr>
      <td>${fechaISO(r.fechaProgramacion)}</td>
      <td><b>${r.numeroDespacho||""}</b></td>
      <td>${r.exportadora||""}<div class="small">${r.mercado||""}</div></td>
      <td>${r.transporte||""}</td>
      <td><span class="badge">${r.horaLlegada?"Cargando":"En espera"}</span></td>
      <td>${hh(r.horaInicioCarga)}</td>
      <td class="tools">
        <button class="good" onclick="edit('${r.id}')">Editar</button>
      </td>
    </tr>`;
  });
}

function leerForm(){
  return {
    id: editId || Date.now().toString(36),
    fechaProgramacion: fechaISO($("fechaProgramacion").value),
    numeroDespacho: $("numeroDespacho").value,
    exportadora: $("exportadora").value,
    tipoMovimiento: $("tipoMovimiento").value,
    variedad: $("variedad").value,
    mercado: $("mercado").value,
    horaCitacion: $("horaCitacion").value,
    cantidadPallets: $("cantidadPallets").value,
    transporte: $("transporte").value,
    horaLlegada: $("horaLlegada").value,
    horaInicioCarga: $("horaInicioCarga").value,
    horaTermino: $("horaTermino").value,
    observaciones: $("observaciones").value,
    cancelado:"false"
  };
}

function postRow(r){
  const f=document.createElement("form");
  f.method="POST"; f.action=API_URL;
  [["secret",SECRET],["payload",JSON.stringify(r)]].forEach(([n,v])=>{
    const i=document.createElement("input");i.type="hidden";i.name=n;i.value=v;f.appendChild(i);
  });
  document.body.appendChild(f); f.submit(); f.remove();
}

window.edit=id=>{
  const r=rows.find(x=>x.id===id);
  if(!r) return;
  editId=id;
  $("fechaProgramacion").value=fechaISO(r.fechaProgramacion);
  Object.keys(r).forEach(k=>$(k)&&($(k).value=r[k]));
};

$("form").onsubmit=e=>{e.preventDefault();postRow(leerForm());editId=null;loadRows();};
$("btnNuevo").onclick=()=>{editId=null;$("form").reset();};
$("btnEliminar").onclick=()=>{if(!editId)return;const r=rows.find(x=>x.id===editId);r.cancelado="true";postRow(r);editId=null;loadRows();};

loadRows();
</script>

</body>
</html>
