<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🚦 Tablero de Despachos</title>

<style>
:root{
  --bg:#0b1220; --card:#101a33; --text:#e9eefc; --muted:#a7b2d6;
  --line:#22305a; --ok:#2ecc71; --warn:#f7b500;
  --work:#2d7dff; --bad:#e74c3c; --pallet:#cfa9ff;
}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:linear-gradient(180deg,#070b14,var(--bg));
  color:var(--text);
}
header{
  padding:16px;
  background:#0b1430;
  border-bottom:1px solid var(--line);
}
.wrap{max-width:1500px;margin:auto;padding:14px}

.kpis{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:16px;
}
.kpi{
  background:#101a33;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  text-align:center;
}
.kpi .label{font-size:12px;color:var(--muted)}
.kpi .value{font-size:26px;font-weight:800}

table{width:100%;border-collapse:collapse;background:#101a33}
th,td{padding:10px;border-bottom:1px solid var(--line)}
th{color:var(--muted)}
.badge{padding:6px 10px;border-radius:999px;color:#fff;font-weight:700}
</style>
</head>

<body>

<header>
  <h2>🚦 Tablero de Despachos</h2>
</header>

<div class="wrap">

<div class="kpis">
  <div class="kpi"><div class="label">🟡 En espera</div><div class="value" id="k1">0</div></div>
  <div class="kpi"><div class="label">🔵 Cargando</div><div class="value" id="k2">0</div></div>
  <div class="kpi"><div class="label">🟢 Despachado</div><div class="value" id="k3">0</div></div>
  <div class="kpi"><div class="label">🔴 No llegó</div><div class="value" id="k4">0</div></div>
  <div class="kpi"><div class="label">📦 Pallets</div><div class="value" id="k5">0</div></div>
</div>

<table>
<thead>
<tr>
  <th>Despacho</th>
  <th>Exportadora</th>
  <th>Movimiento</th>
  <th>Variedad</th>
  <th>Mercado</th>
  <th>Transporte</th>
  <th>Pallets</th>
  <th>Estado</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwj5pxE2ui8O9GEseGX74aktU2EiwDRYxXQbrCTo5uTn8wXbc55p4J5-p0-cJPqarWAJw/exec";

async function render(){
  const res = await fetch(API_URL);
  const rows = await res.json();

  let espera=0, cargando=0, despachado=0, pallets=0;
  const tbody = document.getElementById("tbody");
  tbody.innerHTML="";

  rows.forEach(r=>{
    let estado="En espera", color="#f7b500";
    if(r.horaLlegada && !r.horaTermino){ estado="Cargando"; color="#2d7dff"; cargando++; }
    else if(r.horaTermino){ estado="Despachado"; color="#2ecc71"; despachado++; pallets+=Number(r.cantidadPallets||0); }
    else espera++;

    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r.numeroDespacho||""}</td>
      <td>${r.exportadora||""}</td>
      <td>${r.tipoMovimiento||""}</td>
      <td>${r.variedad||""}</td>
      <td>${r.mercado||""}</td>
      <td>${r.transporte||""}</td>
      <td>${r.cantidadPallets||""}</td>
      <td><span class="badge" style="background:${color}">${estado}</span></td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("k1").textContent=espera;
  document.getElementById("k2").textContent=cargando;
  document.getElementById("k3").textContent=despachado;
  document.getElementById("k4").textContent=0;
  document.getElementById("k5").textContent=pallets;
}

render();
setInterval(render,30000);
</script>

</body>
</html>
