<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🚦 Tablero de Despachos</title>

  <style>
    :root{
      --bg:#0b1220; --card:#101a33; --text:#e9eefc; --muted:#a7b2d6;
      --line:#22305a; --ok:#2ecc71; --warn:#f7b500;
      --work:#2d7dff; --bad:#e74c3c; --pallet:#cfa9ff;
    }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:linear-gradient(180deg,#070b14,var(--bg));
      color:var(--text);
    }
    header{
      padding:16px 18px;
      position:sticky;
      top:0;
      background:rgba(11,18,32,.95);
      backdrop-filter: blur(6px);
      border-bottom:1px solid var(--line);
      z-index:10;
    }
    .wrap{max-width:1500px;margin:0 auto;padding:14px}

    .top{display:grid;gap:12px;align-items:center}
    @media(min-width:980px){ .top{grid-template-columns:1.3fr 1fr 1.8fr} }

    .clockBox{
      text-align:center;border:1px solid var(--line);
      border-radius:14px;padding:12px;background:#0b1430;
    }
    .clock{font-size:46px;font-weight:900}
    .date{margin-top:4px;font-size:14px;color:var(--muted)}

    .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
    .kpi{border:1px solid var(--line);border-radius:14px;padding:10px;background:#0b1430;text-align:center}
    .kpi .label{font-size:12px;color:var(--muted);font-weight:800}
    .kpi .value{font-size:28px;font-weight:900;margin-top:4px}

    table{width:100%;border-collapse:collapse}
    th,td{border-bottom:1px solid var(--line);padding:10px 8px;font-size:15px;text-align:left}
    thead th{position:sticky;top:0;background:#101a33}
    .badge{padding:6px 12px;border-radius:999px;color:#fff;font-weight:900}
  </style>
</head>

<body>

<header>
  <div class="wrap top">
    <div>
      <h1>🚦 Tablero de Despachos</h1>
      <p>Google Sheets en tiempo real</p>
    </div>

    <div class="clockBox">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date">—</div>
    </div>
  </div>
</header>

<div class="wrap">
  <table>
    <thead>
      <tr>
        <th>Despacho</th>
        <th>Exportadora</th>
        <th>Movimiento</th>
        <th>Variedad</th>
        <th>Mercado</th>
        <th>Transporte</th>
        <th>Pallets</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwj5pxE2ui8O9GEseGX74aktU2EiwDRYxXQbrCTo5uTn8wXbc55p4J5-p0-cJPqarWAJw/exec";

function tickClock(){
  const d=new Date();
  document.getElementById("clock").textContent=d.toLocaleTimeString("es-CL");
  document.getElementById("date").textContent=d.toLocaleDateString("es-CL");
}
setInterval(tickClock,1000); tickClock();

async function render(){
  const res = await fetch(API_URL);
  const rows = await res.json();

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  rows.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`
      <td>${r.numeroDespacho||""}</td>
      <td>${r.exportadora||""}</td>
      <td>${r.tipoMovimiento||""}</td>
      <td>${r.variedad||""}</td>
      <td>${r.mercado||""}</td>
      <td>${r.transporte||""}</td>
      <td>${r.cantidadPallets||""}</td>
      <td><span class="badge" style="background:#f7b500">En espera</span></td>
    `;
    tbody.appendChild(tr);
  });
}

render();
setInterval(render,30000);
</script>

</body>
</html>
