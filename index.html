<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✏️ Editar Despachos (Sheets)</title>

<style>
:root{--bg:#0b1220;--card:#101a33;--text:#e9eefc;--muted:#a7b2d6;--line:#22305a;--ok:#2ecc71;--warn:#f7b500;--work:#2d7dff;--bad:#e74c3c;}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:linear-gradient(180deg,#070b14,var(--bg));color:var(--text);}
header{padding:16px 18px;position:sticky;top:0;background:rgba(11,18,32,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);z-index:10}
header h1{margin:0;font-size:18px}
header p{margin:6px 0 0;color:var(--muted);font-size:13px}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px;min-height:70vh}
@media(min-width:980px){.grid{grid-template-columns:1.2fr .8fr}}
.card{background:rgba(16,26,51,.92);border:1px solid var(--line);border-radius:14px;padding:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.filters{display:flex;gap:6px}
input,textarea{width:100%;padding:10px;background:#0b1430;color:var(--text);border:1px solid var(--line);border-radius:10px}
textarea{min-height:90px}
button{border:1px solid var(--line);background:#0b1430;color:var(--text);padding:8px 12px;border-radius:10px;font-weight:900;cursor:pointer}
button.active{background:#2d7dff}
button.good{background:#2ecc71}
button.primary{background:#2d7dff}
button.danger{background:#e74c3c}
table{width:100%;border-collapse:collapse}
#tabla thead th{position:sticky;top:0;background:#101a33;color:var(--muted);border-bottom:2px solid var(--line)}
th,td{border-bottom:1px solid var(--line);padding:8px;font-size:13px}
.badge{padding:6px 10px;border-radius:999px;color:#fff;font-weight:900;font-size:12px}
.small{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>

<body>
<header>
  <h1>✏️ Edición (Google Sheets)</h1>
  <p>Orden automático por fecha + despacho · Oculta históricos (+2 días)</p>
</header>

<div class="wrap grid">

<section class="card">
  <div class="topbar">
    <input id="filtro" placeholder="Buscar despacho, exportadora, mercado…">
    <div class="filters">
      <button id="fHoy">Hoy</button>
      <button id="fManana">Mañana</button>
      <button id="fTodos">Todos</button>
    </div>
  </div>

  <div style="overflow:auto;max-height:70vh">
    <table id="tabla">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Despacho</th>
          <th>Exportadora / Mercado</th>
          <th>Transporte</th>
          <th>Estado</th>
          <th>⏱</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<section class="card">
<form id="form">
  <label>Fecha de programación</label>
  <input id="fechaProgramacion" type="date">

  <label>N° Despacho</label><input id="numeroDespacho">
  <label>Exportadora</label><input id="exportadora">
  <label>Tipo movimiento</label><input id="tipoMovimiento">
  <label>Variedad</label><input id="variedad">
  <label>Mercado</label><input id="mercado">
  <label>Hora citación</label><input id="horaCitacion" type="time">
  <label>Cantidad pallets</label><input id="cantidadPallets" type="number">
  <label>Transporte</label><input id="transporte">
  <label>Hora llegada</label><input id="horaLlegada" type="time">
  <label>Hora inicio carga</label><input id="horaInicioCarga" type="time">
  <label>Hora término carga</label><input id="horaTermino" type="time">
  <label>Observaciones</label><textarea id="observaciones"></textarea>

  <div class="tools" style="margin-top:10px">
    <button class="primary">Guardar</button>
    <button type="button" id="btnNuevo">Nuevo</button>
    <button type="button" id="btnEliminar" class="danger">Eliminar</button>
  </div>
</form>
</section>

</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwj5pxE2ui8O9GEseGX74aktU2EiwDRYxXQbrCTo5uTn8wXbc55p4J5-p0-cJPqarWAJw/exec";
const SECRET="FP2026DESPACHOS";
const $=id=>document.getElementById(id);

let rows=[], editId=null, filtroFecha="rango";

function iso(offset=0){const d=new Date();d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10);}
function hh(v){ if(!v) return ""; if(typeof v==="string") return v.slice(0,5); return new Date(v).toTimeString().slice(0,5); }

function estado(r){
  if(String(r.cancelado||"").toLowerCase()==="true") return {t:"No llegó",c:"#e74c3c"};
  if(!r.horaLlegada) return {t:"En espera",c:"#f7b500"};
  if(!r.horaTermino) return {t:"Cargando",c:"#2d7dff"};
  return {t:"Despachado",c:"#2ecc71"};
}

function pasaFiltroFecha(r){
  const f=r.fechaProgramacion;
  if(!f) return false;
  if(filtroFecha==="rango") return f>=iso(0) && f<=iso(2);
  if(filtroFecha==="today") return f===iso(0);
  if(filtroFecha==="tomorrow") return f===iso(1);
  return true;
}

/* ✅ ORDEN POR FECHA + DESPACHO */
function ordenar(a,b){
  if(a.fechaProgramacion !== b.fechaProgramacion){
    return (a.fechaProgramacion || "").localeCompare(b.fechaProgramacion || "");
  }
  return String(a.numeroDespacho || "").localeCompare(
    String(b.numeroDespacho || ""),
    undefined,
    { numeric: true, sensitivity: "base" }
  );
}

async function loadRows(){
  const r=await fetch(API_URL); return await r.json();
}

function render(){
  const q=($("filtro").value||"").toLowerCase();
  const tb=document.querySelector("#tabla tbody");
  tb.innerHTML="";
  rows
    .filter(pasaFiltroFecha)
    .sort(ordenar)
    .filter(r=>!q||JSON.stringify(r).toLowerCase().includes(q))
    .forEach(r=>{
      const e=estado(r);
      tb.innerHTML+=`
      <tr>
        <td>${r.fechaProgramacion||""}</td>
        <td><b>${r.numeroDespacho||""}</b><div class="small">${r.tipoMovimiento||""}</div></td>
        <td><b>${r.exportadora||""}</b><div class="small">${r.mercado||""} · ${r.variedad||""}</div></td>
        <td>${r.transporte||""}<div class="small">Cita ${hh(r.horaCitacion)}</div></td>
        <td><span class="badge" style="background:${e.c}">${e.t}</span></td>
        <td>${hh(r.horaInicioCarga)||"—"}</td>
        <td class="tools">
          <button class="good" onclick="llego('${r.id}')">Llegó</button>
          <button onclick="inicio('${r.id}')">Iniciar</button>
          <button onclick="termino('${r.id}')">Terminar</button>
          <button onclick="edit('${r.id}')">Editar</button>
        </td>
      </tr>`;
    });
}

async function refresh(){ rows=await loadRows(); render(); }

/* acciones iguales */
</script>
</body>
</html>
